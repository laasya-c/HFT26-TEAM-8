[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wildscope-analytics"
version = "0.1.0"
description = "WILDSCOPE Decision Intelligence & Analytics Module - Phase 1 Shared Contracts and Validation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kolachalama Sri Shravan", email = "srishravank@gmail.com" }
]
dependencies = [
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
